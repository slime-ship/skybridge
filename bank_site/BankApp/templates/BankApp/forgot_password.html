{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Axos Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-custom { width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); background: #fff; }
        .btn-custom { background-color: #1e3a8a; color: white; font-weight: 600; }
        .btn-custom:hover { background-color: #163172; color: white; }
    </style>
</head>
<body>
    <div class="card-custom">
        <h3 class="text-center mb-4" style="color: #1e3a8a; font-weight: 700;">Forgot Password</h3>
        <p class="text-muted text-center mb-4">Enter your email address and we'll send you a code to reset your password.</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">{{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                {{ form.email }}
            </div>
            <button type="submit" class="btn btn-custom w-100">Send Reset Code</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'user_login' %}" class="text-decoration-none">Back to Login</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
